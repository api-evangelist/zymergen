name: Zymergen
description: >-
  Zymergen was a synthetic-biology and bio-manufacturing company founded in 2013 in Emeryville,
  California, that used machine learning and automation to engineer microbes and discover novel
  bio-based materials and molecules. It went public on NASDAQ in 2021 and was acquired by Ginkgo
  Bioworks in October 2022; the zymergen.com domain now 301-redirects to Ginkgo Bioworks. It was
  surfaced as a portfolio company of DCVC, Kindred Ventures, and Obvious Ventures and added to the
  API Evangelist network for enrichment. Enrichment found no public developer portal, API,
  documentation, or event surface — the company has no independent API footprint following the
  acquisition. This profile is retained as a portfolio/history record.
